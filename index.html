<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#efe9dd">
<title>UNSA Move</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#efe9dd;--pan:#fbf8f2;--pan2:#f2ede4;--tx:#1d1b1a;--mut:#7a7268;--line:#e6dfd3;--ac:#22d37a;--ac2:#0f9d58}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Inter,sans-serif;color:var(--tx);background:var(--bg);max-width:520px;margin:auto;position:relative}
.dsp{font-family:'Bricolage Grotesque',sans-serif}
button{font-family:inherit;cursor:pointer;color:inherit}
.emb{position:absolute;pointer-events:none;opacity:.07}
.emb img{width:100%;height:100%;object-fit:contain}

/* MAPA */
#mapWrap{position:absolute;top:0;left:0;right:0;height:58%;transition:height .35s}
body.big #mapWrap{height:30%}
#map{width:100%;height:100%;background:#efe9dd}
.leaflet-container{font-family:Inter,sans-serif}
.leaflet-control-attribution{background:transparent!important;font-size:8px;color:#0006!important;margin-bottom:28px!important}.leaflet-control-attribution a{color:inherit!important}
.leaflet-tooltip{background:#fff;color:var(--tx);border:1px solid var(--line);font-weight:600}
.bm{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font:800 12px Inter;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 30%,transparent)}
.um{background:var(--ac);color:#06210f;font:800 11px Inter;padding:5px 8px;border-radius:9px;border:2px solid #fff;white-space:nowrap}
.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:500}
.logo{background:#1d1b1a;color:#f7f3ea;padding:9px 13px;border-radius:14px;font-size:15px;font-weight:800;box-shadow:0 4px 14px #0003}
.logo b{color:var(--ac)}
.av{width:42px;height:42px;border-radius:50%;background:var(--ac);color:#06210f;font-weight:800;border:3px solid #fff;box-shadow:0 4px 14px #0003}
.toast{position:absolute;top:66px;left:12px;right:12px;background:var(--pan2);border:1px solid var(--ac);padding:13px 14px;border-radius:16px;font-size:13.5px;z-index:600;transform:translateY(-150%);opacity:0;transition:.35s;pointer-events:none;box-shadow:0 10px 30px #0003}
.toast b{display:block;color:var(--ac);margin-bottom:2px}
.toast.on{transform:none;opacity:1}

/* PANEL */
#sheet{position:absolute;left:0;right:0;bottom:0;top:calc(58% - 26px);background:var(--pan);border-radius:26px 26px 0 0;display:flex;flex-direction:column;transition:top .35s;z-index:550;overflow:hidden;box-shadow:0 -10px 34px #0002}
body.big #sheet{top:calc(30% - 26px)}
#sheet .emb{width:70%;height:70%;left:15%;top:22%;opacity:.11;filter:blur(1.5px)}
.handle{padding:9px 0 4px;border:0;background:none;width:100%}
.handle span{display:block;width:42px;height:5px;background:#dcd5c9;border-radius:3px;margin:auto}
.hero{display:flex;justify-content:space-between;align-items:flex-end;padding:4px 20px 12px;position:relative}
.hero small{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--mut)}
.hero .big{font-size:40px;font-weight:800;line-height:1;margin-top:2px}
.hero .big em{font-style:normal;font-size:17px;font-weight:700;margin-left:4px;color:var(--mut)}
.hero p{font-size:13px;color:var(--mut);margin-top:4px}
.hero.off .big{color:#d0452b}
.st8{font-size:11px;font-weight:700;padding:5px 9px;border-radius:20px;background:#22d37a26;color:var(--ac2)}
.st8.w{background:#ffb02026;color:#a76a00}.st8.x{background:#ff6b5b22;color:#c0392b}.st8.g{background:#0000000d;color:var(--mut)}
.seg{display:flex;gap:4px;margin:0 14px;background:var(--bg);border-radius:14px;padding:4px;position:relative}
.seg button{flex:1;border:0;background:none;padding:9px 0;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--mut);position:relative}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 4px #0002}
.seg .dot{position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:#ff6b5b}
#body{flex:1;overflow-y:auto;padding:12px 16px 30px;position:relative}

/* RUTAS */
.r{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.r .bar{width:5px;align-self:stretch;border-radius:3px}
.r .tx{flex:1}.r b{font-size:15px}
.r p{font-size:12.5px;color:var(--mut);margin-top:3px}
.r .e{text-align:right;font-size:21px;font-weight:800;white-space:nowrap}
.r .e small{display:block;font:500 10.5px Inter;color:var(--mut)}
.back{border:0;background:var(--pan2);border-radius:10px;padding:7px 11px;font-weight:600;font-size:13px;margin-bottom:12px}
.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rh h3{font-size:22px}
.meta{display:flex;gap:18px;font-size:12px;color:var(--mut);margin-bottom:14px}
.meta b{display:block;color:var(--tx);font-size:13px;margin-top:2px}
.tl{padding-left:28px}
.s{position:relative;padding:11px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.s::before{content:'';position:absolute;left:-20px;top:0;bottom:0;width:3px;background:var(--c)}
.s:first-child::before{top:50%}.s:last-child::before{bottom:50%}
.s>i{position:absolute;left:-26px;top:50%;margin-top:-7.5px;width:15px;height:15px;border-radius:50%;background:var(--pan);border:3px solid var(--c)}
.s.pas{opacity:.38}.s.nx>i{background:var(--c);box-shadow:0 0 0 5px #0000000f}
.s .nm{font-size:14px;font-weight:600}
.s .nm span{display:block;font-size:12px;font-weight:500;color:var(--mut);margin-top:2px}
.s .nm .tag{display:none;font-size:10px;font-weight:800;color:#06210f;background:var(--ac);padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
.s.nx .nm .tag{display:inline}
.acts{display:flex;gap:6px;flex:none}
.acts a,.acts button{font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--pan2);color:var(--tx);padding:6px 10px;border-radius:9px;text-decoration:none}
.acts .fav{color:var(--ac2);border-color:var(--ac)}
.empty{color:var(--mut);font-size:13.5px;padding:14px;background:var(--pan2);border-radius:12px;margin-bottom:12px}

/* HORARIOS */
.h{padding:12px 0;border-bottom:1px solid var(--line)}
.h .t{display:flex;align-items:center;gap:8px;font-weight:700}
.h .t i{width:10px;height:10px;border-radius:50%}
.h small{display:block;font-size:11px;color:var(--mut);margin:9px 0 5px;letter-spacing:.6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:5px 10px;border-radius:9px;background:var(--pan2)}
.chip.nx{background:var(--ac);color:#06210f;font-weight:700}
.chip.ps{opacity:.3;text-decoration:line-through}

/* AVISOS */
.a{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;border-left:4px solid var(--k)}
.a .hd{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--k)}
.a h5{font-size:15px;margin:6px 0 5px}
.a p{font-size:13px;color:#4a4540;line-height:1.5}
.a.old{opacity:.5}
h4{font-size:11.5px;letter-spacing:1px;color:var(--mut);margin:18px 0 8px}

/* FORMULARIOS */
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:11px 0 5px}
input,select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font:14px Inter;background:#fff;color:var(--tx)}
input:focus,select:focus{outline:none;border-color:var(--ac)}
.btn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:var(--ac);color:#06210f;font-size:15px;font-weight:800}
.btn.sec{background:var(--pan2);color:var(--tx);border:1px solid var(--line)}
.link{border:0;background:none;color:var(--mut);font-weight:600;font-size:14px;margin-top:14px;width:100%}
.ok{color:var(--ac);font-size:13px;margin-top:8px;text-align:center}

/* PASE */
.tk{background:#1d1b1a;color:#f7f3ea;border-radius:22px;padding:20px;position:relative;overflow:hidden}
.tk .emb{opacity:.22;filter:blur(1px);width:180px;height:180px;right:-40px;top:-30px}
.tk small{font-size:11px;letter-spacing:1.2px;opacity:.8}
.tk h3{font-size:24px;margin:4px 0 2px}
.tk .cut{border-top:2px dashed #ffffff50;margin:16px -20px;position:relative}
.tk .cut::before,.tk .cut::after{content:'';position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--pan)}
.tk .cut::before{left:-10px}.tk .cut::after{right:-10px}
.tk .row{display:flex;justify-content:space-between;font-size:11.5px;opacity:.85;gap:8px}
.tk .row b{display:block;font-size:13.5px;opacity:1}
#qr{background:#fff;padding:10px;border-radius:14px;width:max-content;margin:16px auto 0}

/* BIENVENIDA */
#onb{position:absolute;inset:0;z-index:1000;overflow-y:auto;padding:26px 22px 40px;background:#0e1311}
#onb{color:#f7f3ea}
#onb::before,#onb::after{content:'';position:fixed;top:0;bottom:0;left:50%;width:min(100vw,520px);transform:translateX(-50%)}

<script>
/* =========================================================
   DATOS: paraderos (lat, lng aproximados), horarios y buses
   ida = hacia la UNSA · vuelta = desde la UNSA
   ========================================================= */
const UNSA = {n:'Ciudad Universitaria UNSA', d:'Av. Independencia', ll:[-16.4050,-71.5245]};
const RUTAS = [
  {k:'N', n:'Ruta Norte', c:'#4f8cff', min:40, placa:'V2A-481', chofer:'Luis Mamani',
   ida:['6:00','7:00','12:20'], vuelta:['13:10','18:10','21:10'], par:[
   {n:'Cono Norte', d:'Ciudad Municipal', ll:[-16.3355,-71.5810]},
   {n:'Zamácola', d:'Cerro Colorado', ll:[-16.3665,-71.5640]},
   {n:'Av. Ejército', d:'Yanahuara', ll:[-16.3920,-71.5455]}, UNSA]},
  {k:'O', n:'Ruta Oeste', c:'#c77dff', min:25, placa:'V2B-217', chofer:'Rosa Quispe',
   ida:['6:20','7:20','12:40'], vuelta:['13:20','18:20','21:20'], par:[
   {n:'Plaza de Cayma', d:'Cayma', ll:[-16.3700,-71.5450]},
   {n:'Mirador de Yanahuara', d:'Yanahuara', ll:[-16.3879,-71.5419]},
   {n:'Puente Grau', d:'Cercado', ll:[-16.3967,-71.5395]}, UNSA]},
  {k:'S', n:'Ruta Sur', c:'#ff6b5b', min:35, placa:'V2C-905', chofer:'Jorge Huamán',
   ida:['6:10','7:10','12:30'], vuelta:['13:15','18:15','21:15'], par:[
   {n:'Plaza de Socabaya', d:'Socabaya', ll:[-16.4680,-71.5290]},
   {n:'Av. Dolores', d:'J. L. Bustamante', ll:[-16.4180,-71.5170]},
   {n:'Av. Alcides Carrión', d:'Área de Biomédicas', ll:[-16.4120,-71.5255]}, UNSA]},
  {k:'E', n:'Ruta Este', c:'#ffc542', min:30, placa:'V2D-338', chofer:'Ana Condori',
   ida:['6:30','7:30','12:50'], vuelta:['13:30','18:30','21:30'], par:[
   {n:'Plaza de Paucarpata', d:'Paucarpata', ll:[-16.4285,-71.4930]},
   {n:'Av. Kennedy', d:'Paucarpata', ll:[-16.4190,-71.5045]},
   {n:'Mariano Melgar', d:'Mariano Melgar', ll:[-16.4065,-71.5115]}, UNSA]}
];
const TIPOS = {retraso:['RETRASO','#ffb020'], suspension:['SIN SERVICIO','#ff6b5b'], taller:['MANTENIMIENTO','#4f8cff'], info:['COMUNICADO','#22d37a']};

/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id);
const gm = q => 'https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=' + encodeURIComponent(q + ', Arequipa, Perú');
const ahora = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60; };
const aMin = s => { const [a,b] = s.split(':').map(Number); return a*60 + b; };
const hm = m => { m = Math.round(m); const h = Math.floor(m/60) % 24, mi = m % 60; return (h%12 || 12) + ':' + String(mi).padStart(2,'0') + (h < 12 ? ' a.m.' : ' p.m.'); };
const hoy = () => new Date().toISOString().slice(0,10);
const ls = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch(e) { return null; } };

let perfil = ls('um_perfil') || {}, avisos = [], tab = 'rutas', sel = null, dirSel = null;

/* ---------- avisos: afectan el servicio ---------- */
function efecto(r){
  const act = avisos.filter(a => a.activo && (a.ruta === 'todas' || a.ruta === r.k));
  const s = act.find(a => a.efecto === 'suspendido');
  return {susp: !!s, motivo: s ? s.titulo : '', delay: act.filter(a => a.efecto === 'retraso').reduce((t,a) => t + (a.min || 0), 0)};
}
// viajes del día con su hora real de inicio y fin
function viajes(r){
  const e = efecto(r); if (e.susp) return [];
  return [...r.ida.map(h => ({dir:'ida', s:aMin(h)+e.delay})), ...r.vuelta.map(h => ({dir:'vuelta', s:aMin(h)+e.delay}))]
    .map(v => ({...v, e:v.s + r.min})).sort((a,b) => a.s - b.s);
}
const enCurso = r => viajes(r).find(v => ahora() >= v.s && ahora() <= v.e);
const fraccion = (r,v) => { const p = (ahora() - v.s) / r.min; return v.dir === 'ida' ? p : 1 - p; };
const paso = (r,v,j) => v.s + (v.dir === 'ida' ? r.f[j] : 1 - r.f[j]) * r.min;
const proximo = (r,j,dir) => { for (const v of viajes(r)) if ((!dir || v.dir === dir) && paso(r,v,j) >= ahora() - .5) return {v, t:paso(r,v,j)}; return null; };

/* ---------- geometría: la ruta sigue las calles reales (OSRM + OpenStreetMap) ---------- */
async function trazar(r){
  const key = 'um_geo_' + r.k, cache = ls(key);
  if (cache) return cache;
  try {
    const pts = r.par.map(p => p.ll[1] + ',' + p.ll[0]).join(';');
    const j = await (await fetch(`https://router.project-osrm.org/route/v1/driving/${pts}?overview=full&geometries=geojson`)).json();
    const g = {ll: j.routes[0].geometry.coordinates.map(c => [c[1], c[0]]), legs: j.routes[0].legs.map(l => l.distance)};
    ls(key, g); return g;
  } catch(e) { return {ll: r.par.map(p => p.ll), legs: null}; }   // sin internet: línea recta
}
const dist = (a,b) => Math.hypot((b[1]-a[1]) * 106700, (b[0]-a[0]) * 110540);
function preparar(r, g){
  r.geo = g.ll; r.cd = [0];
  for (let i = 1; i < r.geo.length; i++) r.cd.push(r.cd[i-1] + dist(r.geo[i-1], r.geo[i]));
  const tot = r.cd.at(-1);
  if (g.legs) { let a = 0; r.f = [0, ...g.legs.map(d => (a += d) / g.legs.reduce((x,y) => x+y))]; }
  else r.f = r.cd.map(d => d / tot);
}
function puntoEn(r, f){
  const d = Math.min(Math.max(f,0),1) * r.cd.at(-1);
  let i = r.cd.findIndex(x => x >= d); if (i <= 0) return r.geo[0];
  const k = (d - r.cd[i-1]) / (r.cd[i] - r.cd[i-1] || 1);
  return [r.geo[i-1][0] + (r.geo[i][0]-r.geo[i-1][0])*k, r.geo[i-1][1] + (r.geo[i][1]-r.geo[i-1][1])*k];
}

/* ---------- mapa real ---------- */
const map = L.map('map', {zoomControl:false, attributionControl:true}).setView([-16.405,-71.53], 12);
map.attributionControl.setPrefix(false);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {subdomains:'abcd', maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
L.marker(UNSA.ll, {icon: L.divIcon({className:'', html:'<div class="um">UNSA</div>', iconSize:[46,26], iconAnchor:[23,13]})}).addTo(map);
let yo = null;

async function iniciarMapa(){
  const gs = await Promise.all(RUTAS.map(trazar));
  RUTAS.forEach((r,i) => {
    preparar(r, gs[i]);
    r.line = L.polyline(r.geo, {color:r.c, weight:5, opacity:.9}).addTo(map).on('click', () => abrir(i));
    r.stops = r.par.slice(0,-1).map(p => L.circleMarker(p.ll, {radius:6, color:r.c, weight:3, fillColor:'#fff', fillOpacity:1}).bindTooltip(p.n).addTo(map));
    r.bus = L.marker(r.geo[0], {icon: L.divIcon({className:'', html:`<div class="bm" style="--c:${r.c}">${r.k}</div>`, iconSize:[28,28], iconAnchor:[14,14]})}).on('click', () => abrir(i));
  });
  map.fitBounds(L.featureGroup(RUTAS.map(r => r.line)).getBounds(), {padding:[20,20]});
  marcarYo(); render(); tick();
}
function marcarYo(){
  if (yo) map.removeLayer(yo);
  if (!perfil.par) return;
  const [i,j] = perfil.par.split('-').map(Number);
  yo = L.circleMarker(RUTAS[i].par[j].ll, {radius:13, color:'#22d37a', weight:3, fillColor:'#22d37a', fillOpacity:.25}).bindTooltip('Tu paradero').addTo(map);
}
function enfocar(){
  RUTAS.forEach((r,i) => r.line && r.line.setStyle({opacity: sel === null || sel === i ? .9 : .12}));
  if (!RUTAS[0].line) return;
  map.fitBounds(sel === null ? L.featureGroup(RUTAS.map(r => r.line)).getBounds() : RUTAS[sel].line.getBounds(), {padding:[30,30]});
}

/* ---------- notificaciones reales ---------- */
function toast(t, m){ $('toast').innerHTML = `<b>${t}</b>${m}`; $('toast').classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').classList.remove('on'), 7000); }
function notificar(t, m){
  toast(t, m);
  if ('Notification' in window && Notification.permission === 'granted' && navigator.serviceWorker)
    navigator.serviceWorker.ready.then(reg => reg.showNotification(t, {body:m, icon:'icon-192.png', badge:'icon-192.png', tag:t}));
}
function recordatorios(){
  if (!RUTAS.every(r => r.f) || !perfil.par || !perfil.ant) return;
  const [i,j] = perfil.par.split('-').map(Number), r = RUTAS[i], p = r.par[j];
  const env = ls('um_env') || {}; if (env.dia !== hoy()) { env.dia = hoy(); env.k = []; }
  viajes(r).forEach(v => {
    const t = v.dir === 'ida' ? paso(r,v,j) : v.s, key = v.dir + Math.round(t), falta = t - ahora();
    if (falta > 0 && falta <= perfil.ant && !env.k.includes(key)) {
      env.k.push(key);
      const cuando = falta >= 60 ? `en ${Math.round(falta/60)} h` : `en ${Math.round(falta)} min`;
      if (v.dir === 'ida') notificar(`Tu bus pasa ${cuando}`, `El bus de la ${r.n} pasará por ${p.n} a las ${hm(t)}. Te sugerimos estar en el paradero unos minutos antes.`);
      else notificar(`Regreso ${cuando}`, `El bus de regreso de la ${r.n} saldrá de la Ciudad Universitaria a las ${hm(t)} con destino a ${r.par[0].n}.`);
    }
  });
  ls('um_env', env);
}
async function cargarAvisos(){
  try { avisos = await (await fetch('avisos.json?' + Date.now(), {cache:'no-store'})).json(); } catch(e) {}
  const vistos = ls('um_vistos') || [];
  avisos.filter(a => a.activo && !vistos.includes(a.id)).forEach(a => { notificar(a.titulo, a.mensaje); vistos.push(a.id); });
  ls('um_vistos', vistos);
  $('dot').style.display = avisos.some(a => a.activo && !(ls('um_leidos') || []).includes(a.id)) ? '' : 'none';
  render();
}

function estadoRuta(r){
  const e = efecto(r), v = enCurso(r);
  if (e.susp) return {txt:'Sin servicio hoy', b:['x','SUSPENDIDA']};
  if (v) return {txt:(v.dir === 'ida' ? 'Rumbo a la UNSA' : 'Regreso desde la UNSA') + (e.delay ? ` · +${e.delay} min` : ''), b:[e.delay ? 'w' : '', 'EN RUTA'], v};

  return {txt: n ? `Próxima salida ${hm(n.s)} (${n.dir === 'ida' ? 'ida' : 'regreso'})` : 'Terminó su servicio de hoy', b:['g', n ? 'EN ESPERA' : 'FUERA DE HORARIO']};
}

        <button class="btn" id="gNot">${perm === 'granted' ? 'Guardar' : 'Activar notificaciones y guardar'}</button>
        <div class="ok" id="okN">${perm === 'denied' ? 'Las notificaciones están bloqueadas en la configuración del navegador.' : perm === 'no' ? 'Este navegador no admite notificaciones.' : ''}</div>
        <button class="btn sec" onclick="$('onb').classList.remove('off')">Editar mis datos</button>`;
    }
  }
  $('body').innerHTML = h;
  if (tab === 'pase' && perfil.cui && window.QRCode) new QRCode($('qr'), {text:`UNSA-MOVE|${perfil.cui}|${perfil.nom}|${perfil.par}`, width:150, height:150});
  if ($('gNot')) $('gNot').onclick = async () => {
    perfil.ant = +$('ant').value; guardar();
    if (perfil.ant && 'Notification' in window && Notification.permission === 'default') await Notification.requestPermission();
    render(); $('okN').textContent = 'Preferencias guardadas.';
  };
  tick();
}
function abrir(i){ sel = i; tab = 'rutas'; render(); enfocar(); }
function fav(i,j){ perfil.par = i+'-'+j; guardar(); render(); }
function guardar(){ ls('um_perfil', perfil); $('avatar').textContent = perfil.nom ? perfil.nom.split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase() : '?'; marcarYo(); }

/* ---------- actualización en vivo (cada segundo, con la hora real) ---------- */
function tick(){
  if (!RUTAS.every(r => r.f)) return;
  const n = ahora();
  RUTAS.forEach((r,i) => {
    if (!r.geo) return;
    const st = estadoRuta(r);
    if (st.v) { r.bus.setLatLng(puntoEn(r, fraccion(r, st.v))); if (!map.hasLayer(r.bus)) r.bus.addTo(map); }
    else if (map.hasLayer(r.bus)) map.removeLayer(r.bus);
    if ($('rs'+i)) {
      $('rs'+i).textContent = st.txt;
      $('re'+i).innerHTML = st.v ? `${Math.max(1, Math.round(st.v.e - n))} min<small>${st.v.dir === 'ida' ? 'a la UNSA' : 'al destino'}</small>` : `<small>—</small>`;
    }
  });
  if (sel !== null && RUTAS[sel].geo) {
    const r = RUTAS[sel], v = estadoRuta(r).v || viajes(r).find(x => x.s > n);
    if (v && v.dir !== dirSel) return render();
    r.par.forEach((x,j) => {
      const el = $('s'+j); if (!el || !v) return;
      const t = paso(r,v,j), pas = t < n, nx = !pas && !r.par.some((_,k) => k !== j && paso(r,v,k) >= n && paso(r,v,k) < t);
      el.className = 's' + (pas ? ' pas' : nx ? ' nx' : '');
      $('sh'+j).textContent = pas ? `Pasó a las ${hm(t)}` : t - n < 60 ? `Llega en ${Math.max(1, Math.round(t - n))} min · ${hm(t)}` : `Llega a las ${hm(t)}`;
    });
  }
  // cabecera
  const hero = $('hero'); hero.classList.remove('off');
  let T = '', E = '', S = '', B = ['',''];
  if (perfil.par) {
    const [i,j] = perfil.par.split('-').map(Number), r = RUTAS[i], e = efecto(r);
    T = 'TU BUS · ' + r.n.toUpperCase();
    if (e.susp) { hero.classList.add('off'); E = 'Sin servicio'; S = e.motivo; B = ['x','HOY'];}
    else {
      const p = proximo(r,j,'ida') || proximo(r,j,'vuelta');
      if (!p) { E = 'Mañana'; S = `Primera salida: ${hm(aMin(r.ida[0]))} desde ${r.par[0].n}`; B = ['g','SIN MÁS SALIDAS']; }
      else {
        const f = p.t - n;
        E = f < 60 ? `${Math.max(1, Math.round(f))}<em>min</em>` : hm(p.t).replace(/ (.+)/, '<em>$1</em>');
        S = (p.v.dir === 'ida' ? 'Pasa por ' : 'Regreso llega a ') + r.par[j].n + (e.delay ? ` · retraso de ${e.delay} min` : '');
        B = f < 60 ? (e.delay ? ['w','CON RETRASO'] : ['','EN CAMINO']) : ['g','PROGRAMADO'];
      }
    }
  } else {
    T = 'PRÓXIMO BUS A LA UNSA';
    const c = RUTAS.map(r => ({r, v: viajes(r).find(v => v.dir === 'ida' && v.e >= n)})).filter(x => x.v).sort((a,b) => a.v.e - b.v.e)[0];
    if (!c) { E = 'Mañana'; S = 'Primera salida 6:00 a.m. · Ruta Norte'; B = ['g','SIN MÁS SALIDAS']; }
    else { const f = c.v.e - n; E = f < 60 ? `${Math.round(f)}<em>min</em>` : hm(c.v.e).replace(/ (.+)/, '<em>$1</em>'); S = c.r.n + ' · llegada a la Ciudad Universitaria'; B = ['','EN SERVICIO']; }
  }
  $('hT').textContent = T; $('hE').innerHTML = E; $('hS').textContent = S;
  $('hB').className = 'st8 ' + B[0]; $('hB').textContent = B[1]; $('hB').style.display = B[1] ? '' : 'none';
}

/* ---------- eventos ---------- */
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { tab = b.dataset.t; if (tab !== 'rutas' && sel !== null) { sel = null; enfocar(); } render(); });
$('handle').onclick = () => { document.body.classList.toggle('big'); setTimeout(() => { map.invalidateSize(); enfocar(); }, 380); };
$('avatar').onclick = () => { tab = 'pase'; sel = null; render(); enfocar(); };
$('oPar').innerHTML = '<option value="">Elige tu paradero</option>' + RUTAS.map((r,i) =>
  `<optgroup label="${r.n}">${r.par.slice(0,-1).map((x,j) => `<option value="${i}-${j}">${x.n} · ${x.d}</option>`).join('')}</optgroup>`).join('');
$('fOnb').onsubmit = e => {
  e.preventDefault();
  perfil = {...perfil, nom:$('oNom').value.trim(), cui:$('oCui').value.trim(), esc:$('oEsc').value.trim(), par:$('oPar').value};
  guardar(); $('onb').classList.add('off'); tab = 'pase'; render();
};
$('skip').onclick = () => $('onb').classList.add('off');
if (perfil.cui) { $('onb').classList.add('off'); $('oNom').value = perfil.nom; $('oCui').value = perfil.cui; $('oEsc').value = perfil.esc || ''; $('oPar').value = perfil.par || ''; }

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
guardar(); render(); iniciarMapa(); cargarAvisos();
setInterval(tick, 1000);
setInterval(recordatorios, 30000);
setInterval(cargarAvisos, 5 * 60 * 1000);
</script>
</body>
</html>
